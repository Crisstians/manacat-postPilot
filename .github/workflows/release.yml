name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: postpilot-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare app icons
        run: npm run prepare:icons

      - name: Build app
        run: npm run build

      - name: Package installer
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Cooldown before GitHub API publish
        run: sleep 90

      - name: Create GitHub Release (retry on rate limit)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 6
          retry_wait_seconds: 120
          command: |
            shopt -s nullglob globstar
            mapfile -t files < <(find artifacts -type f)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No release artifacts found."
              exit 1
            fi
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "${files[@]}" --repo "${{ github.repository }}" --clobber
            else
              gh release create "${{ github.ref_name }}" "${files[@]}" \
                --title "${{ github.ref_name }}" \
                --generate-notes \
                --repo "${{ github.repository }}"
            fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
